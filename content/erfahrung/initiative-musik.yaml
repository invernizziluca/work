de:
  title: "Initiative Musik"
  role: "Praktikum Presse- und Öffentlichkeitsarbeit"
  category: "Kommunikation & PR"
  summary: "Seit September 2026 in der Presse- und Öffentlichkeitsarbeit einer Fördereinrichtung des Bundes: Social-Media-Texte für APPLAUS 2026, Monitoring, Reportings und Newsletter."
  context: "Die Initiative Musik ist die zentrale Fördereinrichtung des Bundes für Popularmusik und Jazz, mit Programmen für Musikschaffende, Musikunternehmen, Livemusik und Export. Zu ihren Projekten gehört der APPLAUS-Award, der Livemusikspielstätten und Konzertreihen für ihre Musikprogramme auszeichnet."
  goal: "Das Team macht Förderprogramme, Preise und Veranstaltungen für Musikschaffende, Branche, Medien und Öffentlichkeit sichtbar. Im Praktikum unterstütze ich diese Kommunikation im Tagesgeschäft."
  contribution: "Für die veröffentlichten APPLAUS-2026-Beiträge auf Instagram habe ich einen Großteil der Texte geschrieben. Bei Veranstaltungen plane und schreibe ich Live-Stories. Außerdem recherchiere ich, beobachte Medien und Social Media, erstelle Reportings zu den Social-Media-Kennzahlen und arbeite an Newsletter, Website und Community Management mit."
  tasks:
    - "Texte für Instagram-Beiträge, unter anderem zu den Live-Acts und zum Musikprogramm von APPLAUS 2026"
    - "Live-Stories für Instagram bei Veranstaltungen planen und schreiben"
    - "Medien- und Social-Media-Monitoring, Recherchen"
    - "Reportings zu den Social-Media-Kennzahlen (intern)"
    - "Mitarbeit an Newsletter, Website und Community Management"
    - "Unterstützung bei Veranstaltungen, zum Beispiel beim Herbstfest im Tresor"
  scope: "Fotos, Grafiken und die Leitung der APPLAUS-Kommunikation liegen beim Team der Initiative Musik. Die Visuals unten zeigen veröffentlichte Beiträge, nicht meine Gestaltung. Reichweiten und andere Kennzahlen sind intern und werden hier nicht genannt. Das Praktikum läuft noch."
  outputs:
    - "Texte für einen Großteil der veröffentlichten APPLAUS-2026-Beiträge auf Instagram; drei Beispiele sind unten verlinkt."
    - "Redaktionelle Unterstützung beim Porträt „domicil, Dortmund: Man möchte eigentlich nur Bands auf die Bühne bringen“ auf applaus-award.de. Text: Thomas Venker, Foto: Andreas Buck. Autor bin ich nicht."
    - "Mithilfe beim Herbstfest der Initiative Musik im Berliner Tresor, vor allem bei der Vorbereitung des Brandings vor Ort. Das ist ein eigenes Event, nicht Teil von APPLAUS; dokumentiert in meinem LinkedIn-Beitrag."
  transfer:
    content: "Für eine Institution mit vielen Zielgruppen schreiben, Kanäle beobachten und Kennzahlen für das Team aufbereiten."
    koordination: "Kommunikation rund um Veranstaltungen vorbereiten und live begleiten."
  learnings:
    - "Gute Pressearbeit braucht präzise Sprache, gutes Timing und gründliche Recherche."
    - "Für eine Institution zu schreiben heißt, viele Zielgruppen gleichzeitig mitzudenken: Musikschaffende, Branche, Medien und Öffentlichkeit."

en:
  title: "Initiative Musik"
  role: "Intern, press and public relations"
  category: "Communication & PR"
  summary: "Since September 2026 in press and public relations at a federal funding body: social media copy for APPLAUS 2026, monitoring, reporting and newsletters."
  context: "Initiative Musik is the German federal government's central funding institution for popular music and jazz, with programmes for musicians, music companies, live music and export. Its projects include the APPLAUS award, which honours live music venues and concert series for their programmes."
  goal: "The team makes funding programmes, awards and events visible to musicians, the industry, the media and the public. As an intern I support this communication day to day."
  contribution: "For the published APPLAUS 2026 posts on Instagram I wrote most of the copy. At events I plan and write live stories. I also do research, monitor media and social media, prepare reports on the social media figures and contribute to the newsletter, the website and community management."
  tasks:
    - "Copy for Instagram posts, including the live acts and the music programme of APPLAUS 2026"
    - "Planning and writing Instagram live stories at events"
    - "Media and social media monitoring, research"
    - "Reports on the social media figures (internal)"
    - "Contributing to the newsletter, the website and community management"
    - "Support at events, for example the autumn party at Tresor"
  scope: "Photos, graphics and the lead of the APPLAUS communication lie with the Initiative Musik team. The visuals below show published posts, not my design. Reach and other figures are internal and not shown here. The internship is ongoing."
  outputs:
    - "Copy for most of the published APPLAUS 2026 posts on Instagram; three examples are linked below."
    - "Editorial support for the profile “domicil, Dortmund: Man möchte eigentlich nur Bands auf die Bühne bringen” on applaus-award.de. Text: Thomas Venker, photo: Andreas Buck. I am not the author."
    - "Helped with Initiative Musik's autumn party at Tresor in Berlin, mainly preparing the on-site branding. This was a separate event, not part of APPLAUS; documented in my LinkedIn post."
  transfer:
    content: "Writing for an institution with many audiences, monitoring channels and preparing figures for the team."
    koordination: "Preparing communication around events and covering them live."
  learnings:
    - "Good press work needs precise language, good timing and thorough research."
    - "Writing for an institution means keeping many audiences in mind at once: musicians, the industry, the media and the public."

it:
  title: "Initiative Musik"
  role: "Stage, ufficio stampa e relazioni pubbliche"
  category: "Comunicazione e PR"
  summary: "Da settembre 2026 nell'ufficio stampa di un ente federale tedesco: testi social per APPLAUS 2026, monitoraggio dei media, report e newsletter."
  context: "Initiative Musik è l'ente centrale del governo federale tedesco per la promozione della popular music e del jazz, con programmi per artisti, aziende musicali, musica dal vivo ed export. Tra i suoi progetti c'è il premio APPLAUS, che riconosce locali di musica dal vivo e rassegne di concerti per la loro programmazione."
  goal: "Il team rende visibili programmi di sostegno, premi ed eventi per artisti, settore, media e pubblico. Durante lo stage supporto questa comunicazione nel lavoro quotidiano."
  contribution: "Per i post APPLAUS 2026 pubblicati su Instagram ho scritto gran parte dei testi. Durante gli eventi pianifico e scrivo le storie live. Inoltre faccio ricerche, monitoro media e social, preparo report sui numeri dei social e collaboro a newsletter, sito e community management."
  tasks:
    - "Testi per i post Instagram, tra cui i live act e il programma musicale di APPLAUS 2026"
    - "Pianificare e scrivere storie live su Instagram durante gli eventi"
    - "Monitoraggio di media e social, ricerche"
    - "Report sui numeri dei social (interni)"
    - "Collaborazione a newsletter, sito e community management"
    - "Supporto agli eventi, per esempio alla festa d'autunno al Tresor"
  scope: "Foto, grafiche e guida della comunicazione APPLAUS sono del team di Initiative Musik. I visual qui sotto mostrano post pubblicati, non una mia grafica. Copertura e altri numeri sono interni e non vengono indicati. Lo stage è in corso."
  outputs:
    - "Testi per gran parte dei post APPLAUS 2026 pubblicati su Instagram; tre esempi sono linkati qui sotto."
    - "Supporto redazionale al ritratto “domicil, Dortmund: Man möchte eigentlich nur Bands auf die Bühne bringen” su applaus-award.de. Testo: Thomas Venker, foto: Andreas Buck. Non ne sono l'autore."
    - "Aiuto alla festa d'autunno di Initiative Musik al Tresor di Berlino, soprattutto nella preparazione del branding sul posto. È un evento separato, non fa parte di APPLAUS; documentato nel mio post LinkedIn."
  transfer:
    content: "Scrivere per un'istituzione con molti pubblici, monitorare i canali e preparare numeri per il team."
    koordination: "Preparare la comunicazione degli eventi e seguirli in diretta."
  learnings:
    - "Un buon ufficio stampa richiede linguaggio preciso, tempismo e ricerca accurata."
    - "Scrivere per un'istituzione significa pensare a molti pubblici insieme: artisti, settore, media e pubblico."
