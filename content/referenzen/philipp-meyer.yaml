de:
  quote: "Er verbindet Kreativität mit echtem Umsetzungswillen. Das sieht man nicht nur im Gespräch mit ihm, sondern auch in dem, was er bereits angepackt hat, eigene Musikprojekte aufgebaut, Artist Management übernommen, parallel Berufserfahrung in Berlin gesammelt. Das ist kein Lebenslauf, der zufällig passiert ist, sondern einer, hinter dem eine klare Haltung steckt."
  full: |
    Luca ist einer dieser Menschen, die man sich merkt, nicht wegen grosser Gesten, sondern weil er einfach mit echter Neugier und Begeisterung dabei ist, egal worum es geht.

    Ich kenne ihn aus einem gemeinsamen Kontext im Innovationsmanagement, wo wir auch mal unkonventionell gearbeitet haben. Luca hat sich in solchen Momenten nie zurückgelehnt – er war mittendrin, hat hinterfragt, mitgedacht, eigene Ideen eingebracht. Das ist keine Selbstverständlichkeit.

    Was mich an ihm besonders beeindruckt: Er verbindet Kreativität mit echtem Umsetzungswillen. Das sieht man nicht nur im Gespräch mit ihm, sondern auch in dem, was er bereits angepackt hat, eigene Musikprojekte aufgebaut, Artist Management übernommen, parallel Berufserfahrung in Berlin gesammelt. Das ist kein Lebenslauf, der zufällig passiert ist, sondern einer, hinter dem eine klare Haltung steckt. Und ich bin immer noch gerne mit Luca in Kontakt.

    Wer mit Luca zusammenarbeitet, bekommt jemanden, der Dinge wirklich angeht – mit Herzblut und dem nötigen Biss.
en:
  quote: "He combines creativity with a real drive to get things done. You can see it not only when you talk to him, but in what he has already taken on: building his own music projects, taking on artist management, gaining work experience in Berlin at the same time. This is not a CV that happened by chance, but one with a clear attitude behind it."
  full: |
    Luca is one of those people you remember, not because of grand gestures, but because he simply brings genuine curiosity and enthusiasm to whatever he does.

    I know him from a shared context in innovation management, where we sometimes worked in unconventional ways. Luca never sat back in those moments – he was right in the middle of it, questioning, thinking along and bringing in his own ideas. That is not something you can take for granted.

    What impresses me most about him: he combines creativity with a real drive to get things done. You can see it not only when you talk to him, but in what he has already taken on: building his own music projects, taking on artist management, gaining work experience in Berlin at the same time. This is not a CV that happened by chance, but one with a clear attitude behind it. And I am still happy to be in touch with Luca.

    Anyone who works with Luca gets someone who really tackles things – with heart and the necessary bite.
it:
  quote: "Unisce creatività e una vera volontà di realizzare. Lo si vede non solo parlando con lui, ma anche in ciò che ha già affrontato: ha costruito i suoi progetti musicali, si è occupato di artist management, ha fatto esperienza professionale a Berlino allo stesso tempo. Non è un curriculum nato per caso, ma uno dietro cui c'è un atteggiamento chiaro."
  full: |
    Luca è una di quelle persone che ti restano impresse, non per i grandi gesti, ma perché affronta qualsiasi cosa con curiosità ed entusiasmo autentici.

    Lo conosco da un contesto comune di innovation management, in cui a volte abbiamo lavorato in modo poco convenzionale. In quei momenti Luca non si è mai tirato indietro: era nel mezzo, faceva domande, ragionava insieme a noi e portava le sue idee. Non è una cosa scontata.

    Ciò che mi colpisce di più: unisce creatività e una vera volontà di realizzare. Lo si vede non solo parlando con lui, ma anche in ciò che ha già affrontato: ha costruito i suoi progetti musicali, si è occupato di artist management, ha fatto esperienza professionale a Berlino allo stesso tempo. Non è un curriculum nato per caso, ma uno dietro cui c'è un atteggiamento chiaro. E sono ancora felice di essere in contatto con Luca.

    Chi lavora con Luca trova qualcuno che affronta davvero le cose, con passione e la giusta grinta.
