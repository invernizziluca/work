    In occasione di incontri ed eventi di settore, tra cui il Reeperbahn Festival, il signor Invernizzi ha convinto per le sue spiccate capacità comunicative, il suo atteggiamento professionale e le sue eccellenti doti di networking e di costruzione delle relazioni.

    Si è inserito rapidamente in nuovi ambiti, ha dimostrato grande spirito d'iniziativa e ha svolto tutti i compiti affidatigli sempre con la nostra massima soddisfazione.
