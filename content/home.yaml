          href: "/pdf/zeugnis-gebrueder-fritz.pdf"
          text:
            de: "Newsletter-Kampagnen erstellt und versendet, Kontakte in Mailchimp und Pipedrive gepflegt; Foto- und Videocontent unter Beachtung der Corporate Identity"
