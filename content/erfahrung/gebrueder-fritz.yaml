de:
  title: "Gebrüder Fritz"
  role: "Praktikum Sales, Marketing & Administration"
  category: "CRM & Vertriebsunterstützung"
  summary: "Meine erste Station in Berlin: Kundendaten und Deals in Pipedrive, Angebote und Rechnungen in Sevdesk, Newsletter mit Mailchimp und Events in Altbau-Locations."
  context: "Gebrüder Fritz betreibt Eventlocations in Berliner Altbauten. Gebucht werden sie von mittelständischen Unternehmen, Großkonzernen, Organisationen, PR- und Eventagenturen sowie Film- und Fotoproduktionen, für Workshops, Empfänge, Produktpräsentationen und Private Dinings."
  goal: "Anfragen und Kundenbeziehungen sauber begleiten, die Locations über Newsletter und Content sichtbar machen und Events zuverlässig umsetzen."
  contribution: "Im Sales- und Marketingteam pflegte ich Kundendaten und Deals in Pipedrive, verfolgte Anfragen vom Erstkontakt bis zur Angebotsphase und arbeitete an Angeboten und Rechnungen in Sevdesk mit. Ich erstellte und versendete Newsletter-Kampagnen, produzierte Foto- und Videocontent im Corporate Design und half bei Events von der Planung bis zum Abbau."
  tasks:
    - "Sales & CRM: Kundendaten in Pipedrive pflegen, Deals vom Erstkontakt bis zur Angebotsphase anlegen und nachverfolgen"
    - "Mitarbeit an Angeboten und Rechnungen in Sevdesk"
    - "Newsletter: Rückläufer bearbeiten, Kontakte pflegen, Kampagnen mit Mailchimp und Pipedrive erstellen und versenden"
    - "LinkedIn-Recherchen und Unterstützung bei der Planung und Umsetzung von Marketingmaßnahmen"
    - "Events mitplanen, aufbauen, organisieren und abbauen"
    - "Foto- und Videocontent für Marketing und Social Media im Corporate Design, zum Beispiel mit CapCut"
    - "Aufgaben mit der Eisenhower-Matrix organisieren und priorisieren"
    - "Administration: Postfach, Abwesenheitsnotizen, Ansprechpartner und Kontaktdaten aktuell halten"
  scope: "Angebote, Preise und Kundenentscheidungen lagen bei Geschäftsführung und Sales-Team. Ich habe Daten gepflegt, nachgefasst und Unterlagen vorbereitet. Zahlen zu Umsatz oder Buchungen nenne ich nicht."
  outputs:
    - "Deals im CRM nachvollziehbar dokumentiert und bis zur Angebotsphase nachverfolgt"
    - "Angebote und Rechnungen vorbereitet"
    - "Newsletter-Kampagnen erstellt und versendet, Kontakte in Mailchimp und Pipedrive gepflegt"
    - "Foto- und Videomaterial für Marketing und Social Media im Corporate Design"
    - "Im Zeugnis hervorgehoben: gute organisatorische Fähigkeiten, Eigeninitiative und ein freundliches, professionelles Auftreten gegenüber Kund:innen, Partner:innen und Kolleg:innen"
  transfer:
    kontakte: "CRM-Pflege, Deal-Verfolgung und Mitarbeit an Angeboten im B2B-Vertrieb."
    content: "Newsletter und Content im Corporate Design eines Unternehmens."
    koordination: "Events vorbereiten und vor Ort umsetzen; Aufgaben nach Dringlichkeit und Wichtigkeit priorisieren."
  learnings:
    - "Professionelle Kommunikation beginnt bei sauberer Datenpflege, klaren Follow-ups und guter Vorbereitung."
    - "Events wirken nach außen leicht, brauchen intern aber präzise Planung und viele kleine Details."

en:
  title: "Gebrüder Fritz"
  role: "Intern, sales, marketing and administration"
  category: "CRM & sales support"
  summary: "My first role in Berlin: client data and deals in Pipedrive, offers and invoices in Sevdesk, newsletters with Mailchimp and events in period-building venues."
  context: "Gebrüder Fritz runs event venues in historic Berlin buildings. They are booked by medium-sized companies, large corporations, organisations, PR and event agencies, and film and photo productions, for workshops, receptions, product launches and private dinners."
  goal: "Handle enquiries and client relationships carefully, make the venues visible through newsletters and content, and deliver events reliably."
  contribution: "In the sales and marketing team I maintained client data and deals in Pipedrive, followed enquiries from first contact to the offer stage and helped prepare offers and invoices in Sevdesk. I created and sent newsletter campaigns, produced photo and video content in the corporate design and helped at events from planning to breakdown."
  tasks:
    - "Sales & CRM: maintaining client data in Pipedrive, creating deals and following them from first contact to the offer stage"
    - "Helping prepare offers and invoices in Sevdesk"
    - "Newsletters: handling bounces, maintaining contacts, creating and sending campaigns with Mailchimp and Pipedrive"
    - "LinkedIn research and support with planning and running marketing activities"
    - "Helping to plan, set up, organise and break down events"
    - "Photo and video content for marketing and social media in the corporate design, for example with CapCut"
    - "Organising and prioritising tasks with the Eisenhower matrix"
    - "Administration: inbox, out-of-office notes, contact persons and contact data"
  scope: "Offers, prices and client decisions were made by the management and the sales team. I maintained data, followed up and prepared documents. I do not quote revenue or booking figures."
  outputs:
    - "Documented deals in the CRM and followed them up to the offer stage"
    - "Prepared offers and invoices"
    - "Created and sent newsletter campaigns, maintained contacts in Mailchimp and Pipedrive"
    - "Photo and video material for marketing and social media in the corporate design"
    - "Highlighted in the reference letter: good organisational skills, initiative and a friendly, professional manner with clients, partners and colleagues"
  transfer:
    kontakte: "Maintaining a CRM, tracking deals and helping prepare offers in B2B sales."
    content: "Newsletters and content in a company's corporate design."
    koordination: "Preparing events and delivering them on site; prioritising tasks by urgency and importance."
  learnings:
    - "Professional communication starts with clean data, clear follow-ups and good preparation."
    - "Events look effortless from the outside but need precise planning and many small details."

it:
  title: "Gebrüder Fritz"
  role: "Stage, sales, marketing e amministrazione"
  category: "CRM e supporto vendite"
  summary: "La mia prima esperienza a Berlino: dati clienti e trattative in Pipedrive, offerte e fatture in Sevdesk, newsletter con Mailchimp ed eventi in location d'epoca."
  context: "Gebrüder Fritz gestisce location per eventi in palazzi storici di Berlino. Le prenotano medie imprese, grandi gruppi, organizzazioni, agenzie PR ed eventi e produzioni foto e video, per workshop, ricevimenti, presentazioni di prodotto e cene private."
  goal: "Seguire con cura richieste e rapporti con i clienti, rendere visibili le location con newsletter e contenuti e realizzare eventi in modo affidabile."
  contribution: "Nel team sales e marketing ho curato dati clienti e trattative in Pipedrive, seguito le richieste dal primo contatto fino all'offerta e collaborato a offerte e fatture in Sevdesk. Ho creato e inviato campagne newsletter, prodotto contenuti foto e video secondo la corporate identity e aiutato agli eventi dalla pianificazione allo smontaggio."
  tasks:
    - "Sales e CRM: gestione dei dati clienti in Pipedrive, creazione e follow-up delle trattative dal primo contatto fino all'offerta"
    - "Collaborazione a offerte e fatture in Sevdesk"
    - "Newsletter: gestione dei rimbalzi, cura dei contatti, creazione e invio di campagne con Mailchimp e Pipedrive"
    - "Ricerche su LinkedIn e supporto nella pianificazione e realizzazione di attività di marketing"
    - "Aiuto nella pianificazione, allestimento, organizzazione e smontaggio degli eventi"
    - "Contenuti foto e video per marketing e social secondo la corporate identity, per esempio con CapCut"
    - "Organizzazione dei compiti e priorità con la matrice di Eisenhower"
    - "Amministrazione: casella e-mail, risposte automatiche, referenti e dati di contatto"
  scope: "Offerte, prezzi e decisioni con i clienti spettavano alla direzione e al team sales. Io ho curato i dati, fatto follow-up e preparato documenti. Non indico numeri di fatturato o prenotazioni."
  outputs:
    - "Trattative documentate nel CRM e seguite fino alla fase di offerta"
    - "Offerte e fatture preparate"
    - "Campagne newsletter create e inviate, contatti curati in Mailchimp e Pipedrive"
    - "Materiale foto e video per marketing e social secondo la corporate identity"
    - "Sottolineate nel certificato: buone capacità organizzative, spirito d'iniziativa e un modo di fare cordiale e professionale con clienti, partner e colleghi"
  transfer:
    kontakte: "Gestione del CRM, follow-up delle trattative e collaborazione alle offerte nelle vendite B2B."
    content: "Newsletter e contenuti secondo la corporate identity di un'azienda."
    koordination: "Preparare gli eventi e realizzarli sul posto; ordinare i compiti per urgenza e importanza."
  learnings:
    - "La comunicazione professionale inizia da dati puliti, follow-up chiari e una buona preparazione."
    - "Da fuori gli eventi sembrano semplici, ma richiedono pianificazione precisa e tanti piccoli dettagli."
