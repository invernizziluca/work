    At industry meetings and professional events, including Reeperbahn Festival, Mr Invernizzi impressed with his very strong communication skills, his professional manner and his excellent abilities in networking and relationship building.

    He quickly familiarised himself with new topics, showed a high degree of initiative and always completed all tasks assigned to him to our complete satisfaction.
