# ---------------------------------------------------------------------
# Short intros of the sections on the start page
# ---------------------------------------------------------------------
sections:
  experience:
    de: "Fünf Stationen seit 2024, in Berlin, im Tessin und in Mailand. Jede hat eine eigene Seite mit Aufgaben, Ergebnissen und Belegen."
    en: "Five roles since 2024, in Berlin, Ticino and Milan. Each one has its own page with tasks, results and evidence."
    it: "Cinque esperienze dal 2024, a Berlino, in Ticino e a Milano. Ognuna ha una pagina con attività, risultati e riscontri."
  references:
    de: "Was Vorgesetzte und Dozierende über meine Arbeit schreiben."
    en: "What managers and lecturers have written about my work."
    it: "Cosa scrivono del mio lavoro responsabili e docenti."
  education:
    de: "Mein Weg führt von der Berufslehre an die Fachhochschule, typisch für das Schweizer Bildungssystem. Bei jedem Abschluss steht kurz, was er bedeutet."
    en: "My path led from a vocational apprenticeship to a university of applied sciences, a typical route in the Swiss system. Each qualification comes with a short explanation."
    it: "Il mio percorso va dall'apprendistato alla scuola universitaria professionale, una via tipica del sistema svizzero. Per ogni titolo c'è una breve spiegazione."
  proof:
    de: "Zeugnisse, Zertifikate und Forschungsarbeiten zum Nachlesen. Persönliche Daten wie Geburtsdatum und Adresse sind geschwärzt."
    en: "Reference letters, certificates and research papers to read in full. Personal data such as date of birth and address have been redacted. The documents are in German."
    it: "Certificati di lavoro, attestati e ricerche da leggere per intero. I dati personali come data di nascita e indirizzo sono oscurati. I documenti sono in tedesco."
  contact:
    de: "Am schnellsten erreichen Sie mich per E-Mail oder über LinkedIn. Mein Wohnsitz ist in der Schweiz; ich bin offen für Stellen in Deutschland, der Schweiz und Polen und kann für eine Stelle nach Warschau ziehen."
    en: "The easiest way to reach me is by email or LinkedIn. I am based in Switzerland, have professional experience in Berlin and am open to roles in Germany, Switzerland and Poland, including relocating to Warsaw."
    it: "Puoi contattarmi via email o LinkedIn. Risiedo in Svizzera, ho esperienza professionale a Berlino e valuto opportunità in Germania, Svizzera e Polonia, incluso un trasferimento a Varsavia."

