name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The action versions in this file run on Node 24, the runtime GitHub requires since September 2026.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Work out the public address
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ -f static/CNAME ]; then
            echo "SITE_URL=https://$(tr -d '[:space:]' < static/CNAME)/" >> $GITHUB_ENV
          elif [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            echo "SITE_URL=https://$OWNER.github.io/" >> $GITHUB_ENV
          else
            echo "SITE_URL=https://$OWNER.github.io/$REPO_NAME/" >> $GITHUB_ENV
          fi

      - name: Build
        run: python build.py --site-url "$SITE_URL"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
