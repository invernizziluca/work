        de: "Für einen Berliner Anbieter von Eventlocations habe ich Kundendaten und Deals in Pipedrive gepflegt, Anfragen bis zur Angebotsphase nachverfolgt und an Angeboten und Rechnungen mitgearbeitet."
        en: "For a Berlin event venue company I maintained client data and deals in Pipedrive, followed enquiries to the offer stage and helped prepare offers and invoices."
        it: "Per un'azienda berlinese di location per eventi ho curato dati clienti e trattative in Pipedrive, seguito le richieste fino all'offerta e collaborato a offerte e fatture."
      mine:
