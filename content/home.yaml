            de: "83.767 Instagram-Aufrufe in 14 Tagen, 59,8 % davon von Nicht-Followern; 1.932 % mehr erreichte Konten als im Vorzeitraum"
            en: "83,767 Instagram views in 14 days, 59.8% of them from non-followers; 1,932% more accounts reached than in the previous period"
