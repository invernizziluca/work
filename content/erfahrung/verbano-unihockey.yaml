de:
  title: "Verbano Unihockey"
  role: "Marketing & Social Media Manager (ehrenamtlich)"
  summary: "Ehrenamtlich für einen Tessiner Unihockeyverein: Redaktionspläne, Kampagnen, Website und Sponsoring-Kommunikation, geplant auf Basis von Daten."
  context: "Verbano Unihockey ist ein Unihockeyverein im Tessin. Der Verein brauchte einen zeitgemäßen Onlineauftritt mit News, Teams und Sponsoren und eine Kommunikation, die Mitglieder, Fans und Partner:innen gleichermaßen erreicht. Unihockey ist auch mein Sport: Ich spiele selbst in der Bundesliga."
  contribution: "Ich habe Inhalte in Redaktionsplänen geplant, Kampagnen umgesetzt, die Website neu strukturiert und gepflegt und die Kommunikation mit Sponsor:innen koordiniert. Grundlage für die Planung waren die Instagram-Insights."
  tasks:
    - "Redaktionspläne und Kampagnen für Instagram planen und umsetzen"
    - "Insights auswerten und Inhalte daran ausrichten"
    - "Website-Struktur neu aufbauen und laufend pflegen"
    - "News und Social-Media-Inhalte aufbereiten und veröffentlichen"
    - "Sponsoring-Kommunikation und visuelle Präsenz koordinieren"
  outputs:
    - "Kampagnen, die weit über die eigene Community hinaus gesehen wurden"
    - "Eine aktuelle Website als zentrale Plattform für Verein, Fans und Sponsor:innen"
    - "Ein strukturierter Ablauf für wiederkehrende Inhalte"
  highlights:
    - value: "83.767"
      label: "Instagram-Aufrufe in 14 Tagen (5. bis 18. August)"
    - value: "59,8 %"
      label: "dieser Aufrufe von Nicht-Followern"
    - value: "+1.932 %"
      label: "erreichte Konten im Vergleich zum Vorzeitraum (4.775 Konten)"
  transfer:
    content: "Content-Planung mit Daten und messbarer Reichweite."
    kontakte: "Kommunikation mit Sponsor:innen und Partner:innen."
  learnings:
    - "Mit Daten planen: Die Insights zeigen, welche Inhalte neue Menschen erreichen."
    - "Fans, Mitglieder und Sponsor:innen wollen unterschiedliche Dinge hören. Gute Kommunikation trennt das klar."

en:
  title: "Verbano Unihockey"
  role: "Marketing & social media manager (volunteer)"
  summary: "Volunteer work for a floorball club in Ticino: editorial plans, campaigns, website and sponsor communication, planned with data."
  context: "Verbano Unihockey is a floorball club in Ticino. The club needed an up-to-date online presence with news, teams and sponsors, and communication that reaches members, fans and partners alike. Floorball is also my sport: I play in the Bundesliga myself."
  contribution: "I planned content in editorial calendars, ran campaigns, restructured and maintained the website and coordinated communication with sponsors. My planning was based on Instagram insights."
  tasks:
    - "Planning and running editorial calendars and campaigns on Instagram"
    - "Analysing insights and adapting content to them"
    - "Rebuilding and maintaining the website structure"
    - "Preparing and publishing news and social media content"
    - "Coordinating sponsor communication and visual presence"
  outputs:
    - "Campaigns that were seen far beyond the club's own community"
    - "An up-to-date website as the central platform for club, fans and sponsors"
    - "A structured workflow for recurring content"
  highlights:
    - value: "83,767"
      label: "Instagram views in 14 days (5 to 18 August)"
    - value: "59.8%"
      label: "of those views from non-followers"
    - value: "+1,932%"
      label: "accounts reached compared with the previous period (4,775 accounts)"
  transfer:
    content: "Content planning with data and measurable reach."
    kontakte: "Communication with sponsors and partners."
  learnings:
    - "Planning with data: the insights show which content reaches new people."
    - "Fans, members and sponsors want to hear different things. Good communication keeps them apart."

