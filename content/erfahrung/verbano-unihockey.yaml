  context: "Il Verbano Unihockey è una società di unihockey in Ticino. Aveva bisogno di una presenza online aggiornata, con news, squadre e sponsor, e di una comunicazione capace di raggiungere soci, tifosi e partner. L'unihockey è anche il mio sport: gioco io stesso in Bundesliga."
  contribution: "Ho pianificato i contenuti in piani editoriali, realizzato campagne, ristrutturato e curato il sito e coordinato la comunicazione con gli sponsor. La base della pianificazione erano gli insights di Instagram."
  tasks:
    - "Pianificare e realizzare piani editoriali e campagne su Instagram"
    - "Analizzare gli insights e adattare i contenuti"
    - "Ricostruire e curare la struttura del sito"
    - "Preparare e pubblicare news e contenuti social"
    - "Coordinare la comunicazione con gli sponsor e la presenza visiva"
  outputs:
    - "Campagne viste ben oltre la community del club"
    - "Un sito aggiornato come piattaforma centrale per club, tifosi e sponsor"
    - "Un processo strutturato per i contenuti ricorrenti"
  highlights:
    - value: "83.767"
      label: "visualizzazioni su Instagram in 14 giorni (5–18 agosto)"
    - value: "59,8 %"
      label: "di queste da non follower"
    - value: "+1.932 %"
      label: "account raggiunti rispetto al periodo precedente (4.775 account)"
  transfer:
    content: "Pianificazione dei contenuti con i dati e una portata misurabile."
    kontakte: "Comunicazione con sponsor e partner."
  learnings:
    - "Pianificare sui dati: gli insights mostrano quali contenuti raggiungono persone nuove."
    - "Tifosi, soci e sponsor vogliono sentire cose diverse. Una buona comunicazione lo tiene presente."
