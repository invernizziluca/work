de:
  title: "Eintracht Pankow Musik"
  role: "Praktikum Produktmanagement und Label-Operations"
  category: "Outreach & digitale Kanäle"
  summary: "Sechs Monate in einem unabhängigen Berliner Musikunternehmen, eng an der Seite des Geschäftsführers: Erstkontakte zu Artists, digitale Kanäle und ein Trend-Mailout."
  context: "Eintracht Pankow ist ein unabhängiges Musikunternehmen aus Berlin mit Fokus auf Künstlerentwicklung, digitale Vermarktung und zeitgemäße Release- und Content-Strategien. Geschäftsführer ist Jens Herrndorff, Manager der Band Fettes Brot."
  goal: "Die digitalen Kanäle des Labels aktuell halten, potenzielle neue Künstler:innen ansprechen und die Artists mit Informationen zu Social-Media- und Marketingtrends unterstützen."
  contribution: "Ich arbeitete eng mit dem Geschäftsführer zusammen und nahm an den internen Besprechungen teil. Ich nahm Erstkontakt zu potenziellen neuen Künstler:innen auf, richtete den YouTube-Kanal des Labels ein und betreute ihn, pflegte Playlists und den SoundCloud-Kanal, verwaltete Songtexte über Musixmatch und entwickelte ein regelmäßiges Mailout zu Social-Media- und Marketingtrends."
  tasks:
    - "Kontaktaufnahme und Erstkommunikation mit potenziellen neuen Künstler:innen (Signings)"
    - "Konzeption, Einrichtung und Pflege des YouTube-Kanals des Labels; Betreuung des SoundCloud-Kanals"
    - "Regelmäßiges Aktualisieren und Pflegen der Label-Playlists"
    - "Einpflegen und Verwalten von Songtexten über Musixmatch"
    - "Konzeption eines regelmäßigen Mailouts zu Social-Media- und Marketingtrends für die Artists"
    - "Teilnahme an den internen Besprechungen; interne Schulung zu Produktanlage und Anlieferung im Backstage-System des Vertriebspartners Believe"
  scope: "Signings, Releases und Marketingentscheidungen verantwortete das Label. Ich habe unterstützt und die genannten Kanäle betreut. Reichweiten der Kanäle nenne ich hier nicht."
  outputs:
    - "Regelmäßiges Mailout zu Social-Media- und Marketingtrends für die Artists des Labels"
    - "YouTube-Kanal des Labels eingerichtet und gepflegt; Playlists und SoundCloud laufend aktualisiert"
    - "Organisation eines dreitägigen Songwriting Camps unterstützt und die Artists begleitet"
    - "Teilnahme an Branchentreffen wie dem Reeperbahn Festival 2025. Im Zeugnis hervorgehoben: Kommunikationsstärke, professionelles Auftreten, Networking und Beziehungsaufbau"
    - "Gast in einem Music Business Management Panel für Studierende, gemeinsam mit Jens Herrndorff"
    - "Im Zeugnis: „erledigte alle ihm übertragenen Aufgaben jederzeit zu unserer vollsten Zufriedenheit“"
  transfer:
    kontakte: "Potenzielle Partner erstmals ansprechen und Beziehungen auf Branchentreffen aufbauen."
    content: "Digitale Kanäle aufbauen und pflegen, Informationen für eine Zielgruppe kuratieren."
    koordination: "Ein mehrtägiges Format mitorganisieren; Abläufe von der Produktanlage bis zur Anlieferung kennen."
  learnings:
    - "Networking entsteht durch echtes Interesse, gute Vorbereitung und verlässliches Auftreten, nicht durch laute Gesten."
    - "Kanalpflege ist Positionierung: Zielgruppen verstehen und laufend beobachten."

en:
  title: "Eintracht Pankow Musik"
  role: "Intern, product management and label operations"
  category: "Outreach & digital channels"
  summary: "Six months at an independent Berlin music company, working closely with the managing director: artist outreach, digital channels and a trends mailout."
  context: "Eintracht Pankow is an independent music company from Berlin, focused on artist development, digital marketing and contemporary release and content strategies. Its managing director is Jens Herrndorff, the manager of the band Fettes Brot."
  goal: "Keep the label's digital channels up to date, reach out to potential new artists and support the artists with information on social media and marketing trends."
  contribution: "I worked closely with the managing director and took part in the internal meetings. I made first contact with potential new artists, set up and ran the label's YouTube channel, maintained the playlists and the SoundCloud channel, managed lyrics via Musixmatch and developed a regular mailout on social media and marketing trends."
  tasks:
    - "First contact and communication with potential new artists (signings)"
    - "Concept, setup and maintenance of the label's YouTube channel; looking after the SoundCloud channel"
    - "Updating and maintaining the label playlists"
    - "Adding and managing lyrics via Musixmatch"
    - "Concept for a regular mailout on social media and marketing trends for the artists"
    - "Internal meetings; internal training on product setup and delivery in the Backstage system of distribution partner Believe"
  scope: "Signings, releases and marketing decisions were the label's responsibility. I supported the team and looked after the channels listed. I do not quote channel reach here."
  outputs:
    - "A regular mailout on social media and marketing trends for the label's artists"
    - "Set up and maintained the label's YouTube channel; kept playlists and SoundCloud up to date"
    - "Supported the organisation of a three-day songwriting camp and looked after the artists"
    - "Attended industry events such as Reeperbahn Festival 2025. Highlighted in the reference letter: communication skills, a professional manner, networking and relationship building"
    - "Guest on a Music Business Management panel for students, together with Jens Herrndorff"
    - "The reference letter states that I completed all assigned tasks “always to our complete satisfaction”, the highest rating used in German reference letters"
  transfer:
    kontakte: "Approaching potential partners for the first time and building relationships at industry events."
    content: "Building and maintaining digital channels, curating information for an audience."
    koordination: "Co-organising a multi-day format; knowing the steps from product setup to delivery."
  learnings:
    - "Networking grows from genuine interest, preparation and reliability, not from big gestures."
    - "Looking after a channel is positioning: understanding audiences and following them closely."

it:
  title: "Eintracht Pankow Musik"
  role: "Stage, product management e label operations"
  category: "Outreach e canali digitali"
  summary: "Sei mesi in una realtà musicale indipendente di Berlino, accanto all'amministratore delegato: contatti con nuovi artisti, canali digitali e un mailout sui trend."
  context: "Eintracht Pankow è una realtà musicale indipendente di Berlino, con focus su artist development, marketing digitale e strategie di release e contenuti. L'amministratore delegato è Jens Herrndorff, manager della band Fettes Brot."
  goal: "Tenere aggiornati i canali digitali della label, contattare potenziali nuovi artisti e supportare gli artisti con informazioni sui trend social e di marketing."
  contribution: "Ho lavorato a stretto contatto con l'amministratore delegato e ho partecipato alle riunioni interne. Ho avviato i primi contatti con potenziali nuovi artisti, creato e gestito il canale YouTube della label, curato le playlist e il canale SoundCloud, gestito i testi su Musixmatch e sviluppato un mailout periodico sui trend social e di marketing."
  tasks:
    - "Primo contatto e comunicazione con potenziali nuovi artisti (signing)"
    - "Ideazione, creazione e gestione del canale YouTube della label; cura del canale SoundCloud"
    - "Aggiornamento e cura delle playlist della label"
    - "Inserimento e gestione dei testi su Musixmatch"
    - "Ideazione di un mailout periodico sui trend social e di marketing per gli artisti"
    - "Riunioni interne; formazione interna su inserimento e consegna dei prodotti nel sistema Backstage del distributore Believe"
  scope: "Signing, release e decisioni di marketing erano responsabilità della label. Io ho supportato il team e curato i canali indicati. Non riporto qui i numeri di copertura dei canali."
  outputs:
    - "Un mailout periodico sui trend social e di marketing per gli artisti della label"
    - "Canale YouTube della label creato e gestito; playlist e SoundCloud sempre aggiornati"
    - "Supporto all'organizzazione di un songwriting camp di tre giorni, accompagnando gli artisti"
    - "Partecipazione a incontri di settore come il Reeperbahn Festival 2025. Il certificato sottolinea capacità comunicative, professionalità, networking e capacità relazionali"
    - "Ospite di un panel di Music Business Management per studenti, insieme a Jens Herrndorff"
    - "Nel certificato: ho svolto tutti i compiti affidati «sempre con la nostra massima soddisfazione», la formula più alta dei certificati di lavoro tedeschi"
  transfer:
    kontakte: "Contattare per la prima volta potenziali partner e costruire relazioni agli incontri di settore."
    content: "Creare e gestire canali digitali, selezionare informazioni per un pubblico."
    koordination: "Co-organizzare un format di più giorni; conoscere i passaggi dall'inserimento del prodotto alla consegna."
  learnings:
    - "Il networking nasce da interesse autentico, preparazione e affidabilità, non da grandi gesti."
    - "Curare un canale è posizionamento: capire il pubblico e seguirlo con continuità."
