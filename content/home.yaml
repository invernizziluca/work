# ---------------------------------------------------------------------
# The three focus areas ("lenses"). Order = order of the tabs.
#   id:      content / kontakte / koordination (see site.yaml)
#   word:    the big word at the top of the page
#   title:   what the area covers
#   evidence: one line per proof
#     work:   file name of an experience in content/erfahrung/ (links to that page)
#     org:    name to show when there is no "work" (e.g. FFHS)
#     source: zeugnis | screenshot | linkedin | zertifikat | artikel | forschung | eigen
#     href:   where the source can be checked (PDF, image, post). Leave out for "eigen".
#   roles:   job titles this area fits
# ---------------------------------------------------------------------
focus:
  intro:
    de: "Wählen Sie den Bereich, für den Sie jemanden suchen. Zu jeder Aussage steht die Quelle."
    en: "Pick the area you are hiring for. Every statement shows its source."
    it: "Scegli l'ambito per cui cerchi qualcuno. Ogni affermazione indica la sua fonte."
  areas:
    - id: "content"
      word:
        de: "Marketing"
        en: "Marketing"
        it: "Marketing"
      title:
        de: "Kommunikation, PR und Social Media"
        en: "Communication, PR and social media"
        it: "Comunicazione, PR e social media"
      intro:
        de: "Ich erstelle Inhalte in Text, Grafik und Video, betreue Kanäle, Newsletter und Websites und plane anhand von Daten. Zurzeit in der Presse- und Öffentlichkeitsarbeit der Initiative Musik."
        en: "I create content in text, graphics and video, look after channels, newsletters and websites, and plan with data. Currently in the press and public relations team at Initiative Musik."
        it: "Creo contenuti in testo, grafica e video, curo canali, newsletter e siti web e pianifico sulla base dei dati. Oggi nell'ufficio stampa e comunicazione della Initiative Musik."
      evidence:
        - work: "initiative-musik"
          source: "eigen"
          text:
            de: "Social-Media-Content in Text, Grafik und Video, Community Management und Reporting, Mitarbeit an Website und Newsletter, Medienmonitoring"
